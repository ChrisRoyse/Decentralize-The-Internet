node:
  id: "test_node"
  shard_range: [0, 9999]
  role: "full"

crawler:
  max_pages_per_cycle: 5
  user_agent: "TestCrawler/1.0"
  politeness_delay: 0.1
  start_urls:
    - "https://example.com"

dedup:
  similarity_threshold: 0.9

knowledge_graph:
  neo4j_uri: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "test"
  conflict_policy: "store_disputed"

security:
  encryption_at_rest: true
  encryption_in_flight: true
  role_based_access: true
  jwt_secret: "test_secret"
  encryption_password: "test_password"
  allowed_roles:
    - admin
    - analyst
    - crawler 