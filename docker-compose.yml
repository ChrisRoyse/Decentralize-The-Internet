version: '3.8'

secrets:
  neo4j_password:
    file: ./secrets/neo4j_password.txt
  encryption_key:
    file: ./secrets/encryption_key.txt

x-crawler-common: &crawler-common
  build: .
  restart: unless-stopped
  depends_on:
    neo4j:
      condition: service_healthy
  networks:
    - pipeline_network
  secrets:
    - neo4j_password
    - encryption_key
  environment:
    - NEO4J_PASSWORD_FILE=/run/secrets/neo4j_password
    - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
  logging:
    driver: "json-file"
    options:
      max-size: "200m"
      max-file: "10"
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 2G
      reservations:
        cpus: '0.25'
        memory: 512M

services:
  # Full node with all capabilities
  crawler_node1:
    <<: *crawler-common
    environment:
      - NODE_ID=node1
      - NODE_ROLE=full
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD_FILE=/run/secrets/neo4j_password
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - LOG_LEVEL=INFO
    volumes:
      - crawler_data1:/app/data

  # Crawler-only node
  crawler_node2:
    <<: *crawler-common
    environment:
      - NODE_ID=node2
      - NODE_ROLE=crawler-only
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD_FILE=/run/secrets/neo4j_password
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - LOG_LEVEL=INFO
    volumes:
      - crawler_data2:/app/data

  # Knowledge graph only node
  kg_node:
    <<: *crawler-common
    environment:
      - NODE_ID=kg1
      - NODE_ROLE=kg-only
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD_FILE=/run/secrets/neo4j_password
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - LOG_LEVEL=INFO
    volumes:
      - kg_data:/app/data

  # Neo4j database
  neo4j:
    image: neo4j:4.4
    secrets:
      - neo4j_password
    environment:
      - NEO4J_AUTH=neo4j/DOCKER-SECRET:neo4j_password
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=2G
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - pipeline_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - pipeline_network
    depends_on:
      - alertmanager

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - pipeline_network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel

  # Alertmanager for alert notifications
  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - pipeline_network

volumes:
  neo4j_data:
  crawler_data1:
  crawler_data2:
  kg_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  pipeline_network:
    driver: bridge 