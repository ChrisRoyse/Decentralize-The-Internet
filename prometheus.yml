global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'crawler_nodes'
    static_configs:
      - targets: ['crawler_node1:8000', 'crawler_node2:8000', 'kg_node:8000']

  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004'] 